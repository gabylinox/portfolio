<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="perfil">
    <img id="foto" alt="Minha foto" width="120" height="120">
    <h1 id="nome"></h1>
    <p id="cargo" class="cargo"></p>
    <p id="resumo"></p>
    <nav class="contatos" id="contatos"></nav>
  </aside>

  <main>
    <details class="topico">
      <summary><h2>Habilidades</h2></summary>
      <div class="conteudo">
        <h3>Técnicas</h3>
        <ul class="tags" id="hard"></ul>
        <h3>Comportamentais</h3>
        <ul class="tags" id="soft"></ul>
      </div>
    </details>

    <details class="topico">
      <summary><h2>Projetos</h2></summary>
      <div class="conteudo">
        <div class="projetos" id="projetos"></div>
      </div>
    </details>

    <details class="topico">
      <summary><h2>Experiência</h2></summary>
      <div class="conteudo">
        <ul class="linha" id="experiencias"></ul>
      </div>
    </details>

    <details class="topico">
      <summary><h2>Educação</h2></summary>
      <div class="conteudo">
        <ul class="linha" id="educacao"></ul>
      </div>
    </details>

    <details class="topico">
      <summary><h2>Idiomas</h2></summary>
      <div class="conteudo">
        <ul class="tags" id="idiomas"></ul>
      </div>
    </details>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
